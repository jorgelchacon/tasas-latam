name: Fetch Tasas LATAM

on:
  schedule:
    - cron: '0 * * * *'   # cada hora en punto
  workflow_dispatch:        # botón manual para correr cuando quieras

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch precios Binance P2P
        run: python3 scripts/fetch_tasas.py

      - name: Commit y push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tasas.json
          git diff --cached --quiet || git commit -m "chore: tasas $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
